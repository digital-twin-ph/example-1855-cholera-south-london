# The repository checks its own claims on every change, which is what makes review possible
# between co-authors: a graph that references an asset somebody forgot to commit fails here
# rather than in the next person's working copy.
name: Validate the project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-project.mjs
